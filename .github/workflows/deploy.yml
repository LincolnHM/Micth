name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear config.js con API key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "window.GROQ_CONFIG = { apiKey: \"${GROQ_KEY}\" };" > js/config.js
          sed -i '/js\/config\.js/d' .gitignore
          echo "config.js listo"

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,netlify.toml'
