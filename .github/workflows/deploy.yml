name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inyectar API key en chatbot
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 -c "
          import os
          key = os.environ['GROQ_KEY']
          with open('js/chatbot.js', 'r') as f:
              content = f.read()
          content = content.replace(\"window.GROQ_CONFIG?.apiKey || ''\", \"'\" + key + \"'\")
          with open('js/chatbot.js', 'w') as f:
              f.write(content)
          print('API key inyectada correctamente')
          "

      - name: Deploy a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,netlify.toml'
