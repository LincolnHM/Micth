<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Catálogo de decants para imprimir · MICHT Decants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--
    Catálogo de decants para imprimir (lógica en js/admin/print-catalog.js).
    Se arma solo con el catálogo real: perfumes de decant (no los sellados),
    agrupados por casa, con foto, acordes principales, nombre y precios.
    Las hojas son A4 con medidas fijas en milímetros: lo que se ve aquí es lo
    que sale impreso. Los altos de .cover, .house-head, .row y .page-foot deben
    coincidir con PC_MM y PC_SIZES del script, que es quien reparte las hojas.
  -->
  <style>
    :root { --ink: #1b1420; --muted: #6f6877; --line: #e2dbe9; --brand: #7c4fb0; --brand-d: #5a3980; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: #e8e5ed; }
    button { font: inherit; cursor: pointer; }

    /* ─── Barra de opciones (solo en pantalla) ─────────────────────────── */
    .bar { position: sticky; top: 0; z-index: 10; background: #17111f; color: #fff; padding: .7rem 1rem .75rem; box-shadow: 0 4px 18px rgba(0,0,0,.3); }
    .bar-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
    .bar-row + .bar-row { margin-top: .6rem; }
    .bar-back { color: #cbb0e8; text-decoration: none; font-size: .82rem; padding: .35rem .7rem; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; white-space: nowrap; }
    .bar-back:hover { border-color: #cbb0e8; }
    .bar-title { flex: 1; min-width: 180px; }
    .bar-title strong { display: block; font-family: 'Playfair Display', serif; font-size: 1.08rem; }
    .bar-title span { font-size: .78rem; color: #b9b0c6; }
    .bar-print { background: var(--brand); color: #fff; border: 0; font-weight: 700; font-size: .9rem; padding: .7rem 1.3rem; border-radius: 999px; }
    .bar-print:hover:not(:disabled) { background: #9b72c9; }
    .bar-print:disabled { opacity: .5; cursor: default; }
    .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
    .seg button { background: none; border: 0; color: #cfc7da; font-size: .78rem; padding: .45rem .8rem; }
    .seg button + button { border-left: 1px solid rgba(255,255,255,.2); }
    .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }
    .chk { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; color: #e6e0ee; cursor: pointer; }
    .chk input { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
    .bar-houses { background: none; color: #e6e0ee; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; font-size: .8rem; padding: .45rem .9rem; }
    .bar-houses[aria-expanded="true"] { border-color: #cbb0e8; color: #fff; }
    .houses-panel { max-width: 1100px; margin: .7rem auto 0; background: #211930; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: .85rem 1rem; }
    .houses-panel p.hp-hint { font-size: .78rem; color: #b9b0c6; margin-bottom: .6rem; }
    .hp-actions { display: flex; gap: .5rem; margin-bottom: .7rem; }
    .hp-actions button { background: none; border: 1px solid rgba(255,255,255,.2); color: #e6e0ee; border-radius: 999px; font-size: .74rem; padding: .3rem .8rem; }
    .hp-group { margin-bottom: .6rem; }
    .hp-group h3 { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: #cbb0e8; margin-bottom: .35rem; }
    .hp-list { display: flex; flex-wrap: wrap; gap: .35rem .5rem; }
    .hp-list label { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: .28rem .7rem .28rem .5rem; cursor: pointer; }
    .hp-list input { accent-color: var(--brand); }
    .hp-list small { color: #9c93ab; }

    /* ─── Hojas ────────────────────────────────────────────────────────── */
    .sheets { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 0 48px; zoom: var(--zoom, 1); }
    .msg { margin: 3rem auto; max-width: 420px; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .page {
      --cols: 1; --card-h: 74mm; --name-size: 14.5pt;
      width: 210mm; height: 297mm; padding: 8mm 9mm;
      background: #fff; box-shadow: 0 6px 26px rgba(30,15,50,.2);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .page-body { flex: 1; min-height: 0; }
    .page-foot { height: 8mm; display: flex; align-items: flex-end; justify-content: space-between; border-top: .3mm solid var(--line); font-size: 7pt; color: var(--muted); }

    /* Encabezado de la primera hoja: 22mm + 4mm de margen = 26mm */
    .cover { height: 22mm; margin-bottom: 4mm; padding-bottom: 3mm; border-bottom: .6mm solid var(--brand); display: flex; align-items: center; gap: 4mm; }
    .cover img { height: 18mm; width: auto; }
    .cover-brand { flex: 1; }
    .cover-brand strong { display: block; font-family: 'Playfair Display', serif; font-weight: 800; font-size: 19pt; line-height: 1.1; }
    .cover-brand strong span { color: var(--brand); }
    .cover-brand small { font-size: 6.5pt; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
    .cover-info { text-align: right; font-size: 8pt; line-height: 1.5; color: var(--muted); }
    .cover-info b { display: block; font-family: 'Playfair Display', serif; font-size: 12pt; color: var(--ink); }

    /* Título de cada casa: 8mm + 3mm = 11mm */
    .house-head { height: 8mm; margin-bottom: 3mm; display: flex; align-items: center; gap: 3mm; }
    .house-head h2 { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 13.5pt; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
    .house-type { font-size: 6.5pt; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-d); border: .3mm solid var(--brand); border-radius: 99px; padding: .6mm 2.2mm; white-space: nowrap; }
    .house-head i { flex: 1; height: .3mm; background: var(--line); }
    .house-count { font-size: 7.5pt; color: var(--muted); white-space: nowrap; }

    /* Fila de fichas: alto de la ficha + 4mm */
    .row { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 4mm; height: var(--card-h); margin-bottom: 4mm; }
    .card { position: relative; height: var(--card-h); border: .3mm solid var(--line); border-radius: 3mm; padding: 3mm; display: grid; grid-template-rows: minmax(0, 1fr); gap: 4mm; overflow: hidden; }

    .card-photo { grid-area: photo; display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; }
    .card-photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card-photo span { font-family: 'Playfair Display', serif; font-size: 26pt; color: #cbb0e8; }

    .card-bars { grid-area: bars; min-width: 0; display: flex; flex-direction: column; }
    .bars-title { height: 5mm; font-size: 7.5pt; text-align: center; color: var(--muted); }
    .bars { display: flex; flex-direction: column; gap: 1mm; }
    /* min-width: una barra corta nunca recorta su nombre ("cálido especiado") */
    .bar-acc { height: 5.2mm; min-width: fit-content; max-width: 100%; padding: 0 2.2mm; border-radius: 0 2.6mm 2.6mm 0; display: flex; align-items: center; justify-content: center; font-size: 8pt; font-weight: 500; color: #1b1420; white-space: nowrap; overflow: hidden; }
    .card-notes { font-size: 8pt; line-height: 1.5; color: var(--muted); }

    .card-info { grid-area: info; min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-brand { font-size: 6.5pt; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-d); margin-bottom: 1mm; }
    .card-name { font-family: 'Playfair Display', serif; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1.12; font-size: var(--name-size); margin-bottom: 2.5mm; overflow-wrap: anywhere; }
    .card-prices { list-style: none; }
    .card-prices li { display: flex; align-items: baseline; gap: 2mm; font-size: 12.5pt; line-height: 1.5; }
    .card-prices span { min-width: 12mm; font-weight: 500; }
    .card-prices b { font-weight: 700; }
    .card-when { display: flex; flex-wrap: wrap; gap: 1.2mm; margin-top: 2.5mm; }
    .card-when span { font-size: 7pt; font-weight: 600; padding: .5mm 2mm; border-radius: 99px; background: #f3eef8; color: var(--brand-d); white-space: nowrap; }
    .card-dupe { margin-top: 2mm; font-size: 7.5pt; line-height: 1.35; color: var(--muted); }
    .card-dupe b { color: var(--ink); font-weight: 600; }
    .card-out { position: absolute; top: 2.5mm; right: 2.5mm; font-size: 6.5pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #b3261e; border: .3mm solid #e2a19c; border-radius: 99px; padding: .4mm 2mm; background: #fff; }
    .card.is-out .card-photo img { opacity: .55; }

    /* Ajuste automático (pcFit): a la ficha que no le entra el texto se le quita lo menos importante */
    .card.fit-1 .card-dupe { display: none; }
    .card.fit-2 .card-name { font-size: calc(var(--name-size) * .84); }
    .card.fit-3 .card-when { display: none; }

    /* Grande (3 por hoja): foto · acordes · datos, como el catálogo hecho a mano */
    .size-l .card { grid-template-columns: 46mm minmax(0, 1fr) 58mm; grid-template-areas: "photo bars info"; }

    /* Mediano (6) y Compacto (8): dos columnas; a la izquierda la foto y los datos, a la derecha los acordes */
    .size-m, .size-s { --cols: 2; }
    .size-m { --name-size: 10.5pt; }
    .size-m .card, .size-s .card { grid-template-columns: 42mm minmax(0, 1fr); grid-template-rows: 27mm minmax(0, 1fr); grid-template-areas: "photo bars" "info bars"; gap: 2mm 3mm; }
    .size-m .card-info, .size-s .card-info { justify-content: flex-start; }
    .size-m .card-name, .size-s .card-name { margin-bottom: 1.5mm; }
    .size-m .card-prices, .size-s .card-prices { display: grid; grid-template-columns: 1fr 1fr; column-gap: 2mm; }
    .size-m .card-prices li { font-size: 9.5pt; line-height: 1.4; }
    .size-m .card-prices span { min-width: 9mm; }
    .size-m .card-when { margin-top: 1.5mm; }
    .size-m .card-dupe { margin-top: 1.2mm; font-size: 6.8pt; }
    .size-m .bar-acc { font-size: 7.5pt; }

    .size-s { --card-h: 55mm; --name-size: 9pt; }
    .size-s .card { grid-template-columns: 36mm minmax(0, 1fr); grid-template-rows: 19mm minmax(0, 1fr); padding: 2.5mm; }
    .size-s .card-brand { font-size: 6pt; margin-bottom: .6mm; }
    .size-s .card-name { margin-bottom: 1mm; }
    .size-s .card-prices { column-gap: 1mm; }
    .size-s .card-prices li { font-size: 8pt; line-height: 1.4; gap: 1mm; }
    .size-s .card-prices span { min-width: 7mm; }
    .size-s .card-when { margin-top: 1mm; }
    .size-s .card-when span { font-size: 6pt; padding: .3mm 1.5mm; }
    .size-s .card-dupe { display: none; }
    .size-s .bars-title { height: 4.4mm; font-size: 7pt; }
    .size-s .bar-acc { font-size: 7.2pt; }

    @media (max-width: 640px) {
      .bar { position: static; }   /* en el celular ocupa mucho: que no tape las hojas al bajar */
      .bar-print { width: 100%; }
      .seg { width: 100%; }
      .seg button { flex: 1; padding: .5rem .3rem; }
    }

    /* ─── Impresión: cada .page es una hoja A4 completa ────────────────── */
    @page { size: A4 portrait; margin: 0; }
    @media print {
      html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bar { display: none !important; }
      .sheets { display: block; padding: 0; zoom: 1; }
      .page { box-shadow: none; height: 296.8mm; break-after: page; page-break-after: always; }
      .page:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>

  <header class="bar" id="pcBar">
    <div class="bar-row">
      <a class="bar-back" href="../">← Panel</a>
      <div class="bar-title">
        <strong>Catálogo para imprimir</strong>
        <span id="pcSummary">Cargando el catálogo…</span>
      </div>
      <button type="button" class="bar-print" id="pcPrintBtn" disabled>🖨 Imprimir / Guardar PDF</button>
    </div>
    <div class="bar-row">
      <div class="seg" id="pcSizes" role="group" aria-label="Tamaño de las fichas">
        <button type="button" data-size="l">Grande · 3 por hoja</button>
        <button type="button" data-size="m">Mediano · 6</button>
        <button type="button" data-size="s">Compacto · 8</button>
      </div>
      <label class="chk"><input type="checkbox" id="pcSoldOut"> Incluir agotados</label>
      <label class="chk"><input type="checkbox" id="pcHousePage"> Cada casa en hoja nueva</label>
      <button type="button" class="bar-houses" id="pcHousesBtn" aria-expanded="false" aria-controls="pcHousesPanel">Elegir casas ▾</button>
    </div>
    <div class="houses-panel" id="pcHousesPanel" hidden></div>
  </header>

  <main class="sheets" id="pcSheets">
    <p class="msg">Cargando el catálogo…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js" integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti" crossorigin="anonymous"></script>
  <!-- Datos y conexión a Supabase (los mismos de la tienda y el panel) — el orden importa -->
  <script src="../../js/shared/data-core.js?v=20261025-0144"></script>
  <script src="../../js/shared/catalog.js?v=20261025-0144"></script>
  <script src="../../js/shared/data.js?v=20261025-0144"></script>
  <script src="../../js/shared/supabase-config.js?v=20261025-0144"></script>
  <script src="../../js/shared/cloud-products.js?v=20261025-0144"></script>
  <script src="../../js/admin/print-catalog.js?v=20261025-0144"></script>
</body>
</html>
