[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ── Redirects ──────────────────────────────────────────────────────────────────

# www → non-www (canonical domain para Google)
[[redirects]]
  from   = "https://www.michtdecants.com/*"
  to     = "https://michtdecants.com/:splat"
  status = 301
  force  = true

# Proxy /api/chat → función de Netlify (chatbot)
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200
  force  = true

# ── Headers de seguridad y caché ───────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://michtdecants.com;"

# Caché larga para assets (CSS, JS, imágenes)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img PERFUMES/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/imgPerfumesEnteros/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/imgGato/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
