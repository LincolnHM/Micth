[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ── Redirects ──────────────────────────────────────────────────────────────────

# www → non-www (canonical domain para Google)
[[redirects]]
  from   = "https://www.michtdecants.com/*"
  to     = "https://michtdecants.com/:splat"
  status = 301
  force  = true

# Proxy /api/chat → función de Netlify (chatbot)
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200
  force  = true

# Catch-all: cualquier ruta no encontrada → página 404 personalizada
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── Headers de seguridad y caché ───────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-DNS-Prefetch-Control     = "off"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://michtdecants.com https://api.anthropic.com; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'none';"

# HTML principal — siempre fresco (sin caché)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/**/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Caché larga para assets (CSS, JS, imágenes)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img PERFUMES/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/imgPerfumesEnteros/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/imgGato/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Admin: sin caché, sin indexación ──────────────────────────────────────────

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, no-cache, must-revalidate"
