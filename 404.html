<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · Micht Decants</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://michtdecants.com/">
  <meta name="theme-color" content="#c9a84c">

  <!-- Fuentes igual que el sitio principal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #c9a84c;
      --gold-d: #a8863c;
      --black:  #090909;
      --card:   #111111;
      --text:   #e8e8e8;
      --text2:  #a0a0a0;
      --border: rgba(255,255,255,.07);
      --font-sans:  'Montserrat', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      text-align: center;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(201,168,76,.06) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(130,65,10,.07) 0%, transparent 45%),
        var(--black);
    }

    /* ── Logo ── */
    .err-logo {
      display: block;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 auto 2rem;
      box-shadow: 0 0 40px rgba(201,168,76,.15);
      border: 1px solid rgba(201,168,76,.22);
    }
    .err-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ── Número grande ── */
    .err-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(135deg, #c9a84c 0%, #f0d990 50%, #a8863c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.02em;
      margin-bottom: .35rem;
    }

    /* ── Título ── */
    .err-title {
      font-family: var(--font-serif);
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      font-weight: 400;
      color: var(--text);
      letter-spacing: .04em;
      margin-bottom: .75rem;
    }

    /* ── Subtexto ── */
    .err-sub {
      font-size: .85rem;
      color: var(--text2);
      line-height: 1.65;
      max-width: 340px;
      margin: 0 auto 2.25rem;
    }

    /* ── Divisor dorado ── */
    .err-divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 2rem;
    }

    /* ── Botones ── */
    .err-actions {
      display: flex;
      gap: .85rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: var(--gold);
      color: #000;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .72rem 1.75rem;
      border-radius: 50px;
      text-decoration: none;
      transition: background .2s, box-shadow .2s, transform .15s;
      box-shadow: 0 4px 20px rgba(201,168,76,.25);
    }
    .btn-home:hover {
      background: #d9b85c;
      box-shadow: 0 6px 28px rgba(201,168,76,.4);
      transform: translateY(-2px);
    }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      background: transparent;
      color: var(--text2);
      font-family: var(--font-sans);
      font-size: .82rem;
      font-weight: 500;
      letter-spacing: .04em;
      padding: .72rem 1.5rem;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,.12);
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }
    .btn-wa:hover {
      border-color: rgba(201,168,76,.4);
      color: var(--text);
    }

    /* ── Sugerencias ── */
    .err-links {
      display: flex;
      gap: .6rem 1.4rem;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
    }
    .err-links a {
      font-size: .78rem;
      color: var(--text2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .err-links a:hover {
      color: var(--gold);
      border-color: rgba(201,168,76,.4);
    }

    /* ── Footer mínimo ── */
    .err-footer {
      margin-top: 3rem;
      font-size: .7rem;
      color: rgba(255,255,255,.18);
      letter-spacing: .08em;
    }
  </style>
</head>
<body>

  <a href="/" class="err-logo" aria-label="Ir al inicio — Micht Decants">
    <img src="/imgGato/web.png" alt="Logo Micht Decants" loading="lazy">
  </a>

  <div class="err-code" aria-hidden="true">404</div>

  <h1 class="err-title">Página no encontrada</h1>

  <div class="err-divider"></div>

  <p class="err-sub">
    La página que buscas no existe o fue movida.<br>
    Prueba volver al inicio para encontrar tu fragancia.
  </p>

  <div class="err-actions">
    <a href="/" class="btn-home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Ir al inicio
    </a>
  </div>

  <ul class="err-links" aria-label="Páginas sugeridas">
    <li><a href="/">Tienda</a></li>
    <li><a href="/nosotros/">Nosotros</a></li>
    <li><a href="/contacto/">Contacto</a></li>
  </ul>

  <p class="err-footer">MICHT DECANTS &nbsp;·&nbsp; PERÚ</p>

</body>
</html>
